<ion-toolbar>
  <ion-buttons slot="start">
    <ion-back-button default-href="#"></ion-back-button>
  </ion-buttons>
  <ion-title>Every Day Survey</ion-title>
</ion-toolbar>

<ion-content class="ion-padding">
  <p>The every day section of the survey let's you choose the things you want to track every single day. You can add, remove, and rearrange survey components on this page.</p>

  <ion-reorder-group [disabled]="false" (ionItemReorder)="reorderItems($event)">
    <ion-item *ngFor="let survey_item of survey_list" ionReorder>
      <app-survey-item-editor-view [survey_item]="survey_item"></app-survey-item-editor-view>
      <ion-buttons slot="end">
        <ion-button (click)="editSurveyItem(survey_item)">
          <ion-icon name="pencil"></ion-icon>
        </ion-button>
        <ion-button (click)="deleteSurveyItem(survey_item)">
          <ion-icon name="trash"></ion-icon>
        </ion-button>
        <ion-reorder slot="end"></ion-reorder>
      </ion-buttons>
    </ion-item>
  </ion-reorder-group>

  <ion-button color="symptom" (click)="openPreConfiguredSearch('symptom')">Add a Symptom</ion-button>
  <ion-button color="treatment" (click)="openPreConfiguredSearch('treatment')">Add a Treatment</ion-button>

</ion-content>
