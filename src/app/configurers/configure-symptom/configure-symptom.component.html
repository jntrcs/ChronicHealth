
<ion-content class="hi">
  <h2>{{ mode === 'add' ? 'Add Symptom' : 'Edit Symptom' }}
  </h2>
  <form (ngSubmit)="mode === 'add' ? saveSymptom() : updateSymptom()" #symptomForm="ngForm">
    <ion-item>
      <ion-input labelPlacement="floating" label="Symptom Name:" [(ngModel)]="symptomName" name="symptomName" required></ion-input>
    </ion-item>

    <ion-label>
      Track this symptom as:
    </ion-label><br>
    <ion-radio-group value="severity" [(ngModel)]="symptomMeasurement" name="symptomMeasurement">
      <ion-radio color = "symptom" labelPlacement="end" value="severity">Severity</ion-radio><br />
      <ion-radio color = "symptom" labelPlacement="end" value="present">Present / Absent</ion-radio><br />
      <ion-radio color = "symptom" labelPlacement="end" value="count">Count (# of occurrences)</ion-radio><br />
    </ion-radio-group>

    <div class="button-group">
      <ion-button color="symptom" type="submit" [disabled]="!symptomForm.form.valid">{{ mode === 'add' ? 'Save' : 'Update' }}</ion-button>
      <ion-button color="danger" (click)="cancel_click()">Cancel</ion-button>
    </div>
  </form>

<ion-alert
  [isOpen]="isAlertOpen"
  header="Name Taken"
  message="This symptom already exists. Please choose another name."
  [buttons]="alertButtons"
  (didDismiss)="setOpen(false)"
></ion-alert>
</ion-content>
