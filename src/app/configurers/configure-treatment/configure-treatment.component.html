<ion-content>
  <h2>{{ mode === 'add' ? 'Add Treatment' : 'Edit Treatment' }}</h2>
  <form (ngSubmit)="mode === 'add' ? saveTreatment() : updateTreatment()" #treatmentForm="ngForm">
    <ion-item>
      <ion-input labelPlacement="floating" label="Treatment Name:" [(ngModel)]="treatmentName" name="treatmentName"
       required></ion-input>
    </ion-item>

    <ion-label class = "tracker">
      Track this treatment as:
    </ion-label><br>
    <ion-radio-group value="present" [(ngModel)]="treatmentMeasurement" name="treatmentMeasurement" >
      <ion-radio color="treatment" labelPlacement="end" value="present">Taken / Not Taken</ion-radio><br />
      <ion-radio color="treatment" labelPlacement="end" value="count">Count (# of doses)</ion-radio><br />
    </ion-radio-group>

<app-typeahead [items] = "this.all_side_effects" mode="side effect"  (selectionChange)="selectionChanged($event)"
                [selectedItems]="selected_symptom_ids">

</app-typeahead>
<ion-item (click)="create_side_effect()">
  <ion-icon icon="add"></ion-icon>
  <ion-label>New side effect</ion-label>
</ion-item>

    <div class="button-group">
      <ion-button color="primary" type="submit" [disabled]="!treatmentForm.form.valid">{{ mode === 'add' ? 'Save' : 'Update' }}</ion-button>
      <ion-button color="danger" (click)="cancel_click()">Cancel</ion-button>
    </div>
  </form>

<ion-alert
  [isOpen]="isAlertOpen"
  header="Name Taken"
  message="This treatment already exists. Please choose another name."
  [buttons]="alertButtons"
  (didDismiss)="setOpen(false)"
></ion-alert>

</ion-content>
