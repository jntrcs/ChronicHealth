<h5>Select {{this.mode}}s to track with this illness</h5>
<ion-searchbar (ionInput)="searchbarInput($event)"></ion-searchbar>

  <ion-list  [inset]="false">
    <ion-item *ngFor="let item of filteredItems; trackBy: trackItems">
      <ion-checkbox [value]="item.id" [color] = "this.color"
      [checked]="isChecked(item.id)" (ionChange)="checkboxChange($event)"
        >{{ item.name }}</ion-checkbox
      >
      </ion-item>

  </ion-list>
