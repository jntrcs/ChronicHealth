<ion-header>
  <ion-toolbar>
    <ion-title>Confirmation</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
      <p>{{ message }}</p>


  <ion-row>
    <ion-col>
      <ion-button expand="full" (click)="cancel()" color="light">Cancel</ion-button>
    </ion-col>
    <ion-col>
      <ion-button expand="full" (click)="confirm()" color="danger">{{confirm_text}}</ion-button>
    </ion-col>
  </ion-row>
</ion-content>
