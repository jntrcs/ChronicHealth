<ion-row style="display: flex;  justify-content: space-between;">
  <ion-col size="10">
    <ion-row>
      <ion-col>
        <h5>{{ this.treatment.name }}:</h5>

      </ion-col>
      <ion-col>     
        <app-present-view color="treatment" [is_disabled] = "is_disabled" [measurement]="getPresentMeasurement()"></app-present-view>
      </ion-col>
    </ion-row>


  </ion-col>

    <ion-col class="button-row" size="2">  
      <ion-button [disabled] ="is_disabled" class="add-more" color="treatment" size="small" (click)="edit_treatment(treatment)">
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
      </ion-col>
  </ion-row>
  <ion-row>

</ion-row>
