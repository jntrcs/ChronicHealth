<div *ngIf="symptom.measurement.isPresentMeasurement()">
    <app-survey-present-symptom [symptom] = "symptom"></app-survey-present-symptom >
</div>

<div *ngIf="symptom.measurement.isCountMeasurement()">

<div *ngIf="symptom.measurement.isSeverityMeasurement()">

</div>
