<div class="survey_chunk" *ngIf="isSymptom(survey_item)">
    <app-survey-symptom [is_disabled]="is_disabled"  [symptom] = "getSymptom(survey_item)"></app-survey-symptom>
</div>


<div class="survey_chunk" *ngIf="isTreatment(survey_item)">
    <app-survey-treatment [is_disabled]="is_disabled"  [treatment] = "getTreatment(survey_item)"></app-survey-treatment>
</div>

<div class="survey_chunk" *ngIf="isIllness(survey_item)">
    <app-survey-illness [is_disabled]="is_disabled"  [illness] = "getIllness(survey_item)"></app-survey-illness>
</div>
