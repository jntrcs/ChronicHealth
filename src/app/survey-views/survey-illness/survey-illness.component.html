
  <div class="illness-component">
    <ion-grid>
      <ion-row align-items-center>
        <ion-col size="8" class="first-column">
          <h5>{{ illness.name }}</h5>
        </ion-col>
        <ion-col class="third-column" size="2">  
          <ion-button class="add-more" color="illness" size="small" [disabled]="is_disabled">
            <ion-icon name="swap-horizontal"></ion-icon>
          </ion-button>
        </ion-col>
        <ion-col class="third-column" size="2">  
          <ion-button class="add-more" color="illness" size="small" (click) = "edit_illness()" [disabled]="is_disabled">
            <ion-icon name="pencil"></ion-icon>
          </ion-button>
        </ion-col>
        </ion-row>
        <ion-row>
        <ion-col size="auto" class="second-column">
          <ion-item lines="none" class="option-container">
            <ion-label class="option-label" [class.selected]="get_selected_option() === 'suspected'" 
            (click)="selectOption('suspected')" [class.disabled]="is_disabled">Suspected</ion-label>
            <ion-label class="option-label" [class.selected]="get_selected_option() === 'medically confirmed'" 
            (click)="selectOption('medically confirmed')" [class.disabled]="is_disabled">Confirmed</ion-label>
          </ion-item>
        </ion-col>

      </ion-row>
    </ion-grid>
    

<ion-list class="symptom-list">
  <app-compact-symptom *ngFor="let symptom of illness.symptoms" [symptom]="symptom" [is_disabled]="is_disabled"></app-compact-symptom>

</ion-list>


</div>
