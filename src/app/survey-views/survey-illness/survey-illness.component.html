
  <div class="illness-component">
    <ion-grid>
      <ion-row align-items-center>
        <ion-col size="10" class="first-column">
          <h5>{{ illness.name }}</h5>
        </ion-col>
        <ion-col class="third-column" size="2">  
          <ion-button class="add-more" color="illness" size="small">
            <ion-icon name="pencil"></ion-icon>
          </ion-button>
        </ion-col>
        </ion-row>
        <ion-row>
        <ion-col size="auto" class="second-column">
          <ion-item lines="none" class="option-container">
            <ion-label class="option-label" [class.selected]="get_selected_option() === 'suspected'" (click)="selectOption('suspected')">Suspected</ion-label>
            <ion-label class="option-label" [class.selected]="get_selected_option() === 'medically confirmed'" (click)="selectOption('medically confirmed')">Confirmed</ion-label>
          </ion-item>
        </ion-col>

      </ion-row>
    </ion-grid>
    

<ion-list class="symptom-list">
  <app-compact-symptom *ngFor="let symptom of illness.symptoms" [symptom]="symptom"></app-compact-symptom>

</ion-list>


</div>
