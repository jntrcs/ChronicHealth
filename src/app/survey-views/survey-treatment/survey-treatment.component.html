<div *ngIf="isPresentMeasurement(treatment.measurement)">
  <app-survey-present-treatment [is_disabled] = "is_disabled" [treatment] = "treatment"></app-survey-present-treatment >
</div>

<div *ngIf="isCountMeasurement(treatment.measurement)">
  <app-survey-count-treatment [is_disabled] = "is_disabled" [treatment] = "treatment"></app-survey-count-treatment>
</div>



<ion-list class="symptom-list">
  <app-compact-symptom color = "treatment" *ngFor="let side_effects of treatment.side_effects" [symptom]="side_effects" [is_disabled] = "is_disabled"></app-compact-symptom>
</ion-list>
