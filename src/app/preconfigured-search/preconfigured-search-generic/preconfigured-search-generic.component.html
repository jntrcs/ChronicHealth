
<ion-content class="ion-padding">

<ion-searchbar (ionInput)="filterItems($event)"></ion-searchbar>


<div *ngIf="filtered_survey_items.length === 0">
  <!-- Content to show when survey_list is empty -->
  <h5>No items to show</h5>
  <h5>Use the button below to configure a new item</h5>
</div> 
<ion-item *ngFor="let survey_item of filtered_survey_items">


 <ion-list class="settings-card"  (click)="process_item(survey_item)">
    <div class="settings-button">
      <ion-label> {{survey_item.name}}</ion-label>
    </div>
  </ion-list>
</ion-item>

</ion-content>
