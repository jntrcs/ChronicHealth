<ion-header>
  <ion-toolbar>
    <ion-title>
      Daily Survey
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let symptom of symptoms">

      <ion-label>
        <h5>{{ symptom.name }}</h5>
        <ng-container *ngComponentOutlet="symptom.measurement.component"></ng-container>

      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
