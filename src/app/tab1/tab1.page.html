<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      Daily Survey
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <app-survey-item-view *ngFor="let survey_item of survey" [survey_item]="survey_item"></app-survey-item-view>
  </ion-list>
 
  <ion-row>
    <ion-col>
      <ion-button (click) = "save_record()" color="primary">Save</ion-button>

    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
    <ion-button (click)="openPreConfiguredSearch('symptom')"  color="symptom">Record a Symptom</ion-button>
    <ion-button color="illness" >Record an Illness</ion-button>
    <ion-button color="treatment">Record a Treatment</ion-button> 
  </ion-col>
  </ion-row>


</ion-content>
