<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      Daily Survey
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="date-selector">
    <ion-icon
      name="arrow-back"
      (click)="decrementDate()"
    ></ion-icon>

    <div class="date-text">
      {{ currentDate | date:'mediumDate' }}
    </div>

    <ion-icon
      name="arrow-forward"
      [class.disabled]="isToday(currentDate)"
      (click)="incrementDate()"
    ></ion-icon>
  </div>

  <ion-list class="survey_list">
    <app-survey-item-view [is_disabled]="is_disabled" *ngFor="let survey_item of static_survey" [survey_item]="survey_item"></app-survey-item-view>
    <app-survey-item-view [is_disabled]="is_disabled" *ngFor="let survey_item of dynamic_survey" [survey_item]="survey_item"></app-survey-item-view>

  </ion-list>
 
  <ion-row>
    <ion-col>
      <ion-button (click) = "save_record()" color="primary">Save</ion-button>

    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
    <ion-button (click)="openPreConfiguredSearch('symptom')"  color="symptom">Record a Symptom</ion-button>
    <ion-button (click)="openPreConfiguredSearch('illness')" color="illness" >Record an Illness</ion-button>
    <ion-button (click)="openPreConfiguredSearch('treatment')"  color="treatment">Record a Treatment</ion-button> 
  </ion-col>
  </ion-row>


</ion-content>
