<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      Daily Survey
    </ion-title>
  </ion-toolbar>
</ion-header>


  <div class="date-selector">
    <ion-icon
      name="arrow-back"
      (click)="decrementDate()"
    ></ion-icon>

    <div class="date-text">
      {{ currentDate | date:'mediumDate' }}
    </div>

    <ion-icon
      name="arrow-forward"
      [class.disabled]="isToday(currentDate)"
      (click)="incrementDate()"
    ></ion-icon>
  </div>

  <ion-content class="ion-padding">
  <div  *ngIf="static_survey.length === 0 && dynamic_survey.length===0 && historical_survey.length===0">
    <!-- Content to show when survey_list is empty -->
    <h5>Nothing to ask about today</h5>
    <h5>You can  <a routerLink='/static-survey-editor'>add to your everyday survey</a>, record issues below, or report no issues.</h5>
  </div>

  <ion-list class="survey_list">
    <div *ngIf="historical_survey.length === 0">
    <app-survey-item-view  [is_disabled]="is_disabled" *ngFor="let survey_item of static_survey" [survey_item]="survey_item"></app-survey-item-view>
  </div>
    <app-survey-item-view [is_disabled]="is_disabled" *ngFor="let survey_item of historical_survey" [survey_item]="survey_item"></app-survey-item-view>
    <app-survey-item-view [is_disabled]="is_disabled" *ngFor="let survey_item of dynamic_survey" [survey_item]="survey_item"></app-survey-item-view>

  </ion-list>
 
  <ion-row>
    <ion-col>

      <ion-button (click) = "update_record()" *ngIf="is_disabled; else enabledButton" color="primary">Update</ion-button>
<ng-template #enabledButton>
  <ion-button *ngIf="static_survey.length !== 0 || dynamic_survey.length!==0 || historical_survey.length!==0" (click) = "save_record()" color="primary">Save</ion-button>
  <ion-button *ngIf="static_survey.length === 0 && dynamic_survey.length===0 && historical_survey.length===0" (click) = "save_record()" color="primary">Report No Issues</ion-button>

</ng-template>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
    <ion-button [disabled] = "is_disabled" (click)="openPreConfiguredSearch('symptom')"  color="symptom">Record a Symptom</ion-button>
    <ion-button [disabled] = "is_disabled" (click)="openPreConfiguredSearch('illness')" color="illness" >Record an Illness</ion-button>
    <ion-button [disabled] = "is_disabled" (click)="openPreConfiguredSearch('treatment')"  color="treatment">Record a Treatment</ion-button> 
   <ion-button  (click)="logDynamicSurvey()"  color="treatment">Log Dynamic Survey</ion-button>

  </ion-col>
  </ion-row>


</ion-content>
