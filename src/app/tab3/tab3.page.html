<ion-header [translucent]="false">
  <ion-toolbar color="primary">
    <ion-title>
      Settings
    </ion-title>
  </ion-toolbar>
</ion-header>


<ion-content>
  <ion-card class="settings-card" (click)="goToStaticSurveyEditor()">
    <ion-card-content>
      <div class="settings-button">
        <ion-label>Edit Every Day Survey</ion-label>
        <ion-icon name="arrow-forward" class="arrow-icon"></ion-icon>
      </div>
    </ion-card-content>
  </ion-card>
  <ion-card class="settings-card" (click)="goToSymptomListEditor('symptom')">
    <ion-card-content>
      <div class="settings-button">
        <ion-label>Edit Existing Symptoms</ion-label>
        <ion-icon name="arrow-forward" class="arrow-icon"></ion-icon>
      </div>
    </ion-card-content>
  </ion-card>
  <ion-card class="settings-card" (click)="goToSymptomListEditor('treatment')">
    <ion-card-content>
      <div class="settings-button">
        <ion-label>Edit Existing Treatments</ion-label>
        <ion-icon name="arrow-forward" class="arrow-icon"></ion-icon>
      </div>
    </ion-card-content>
  </ion-card>
  <ion-card class="settings-card" (click)="goToSymptomListEditor('illness')">
    <ion-card-content>
      <div class="settings-button">
        <ion-label>Edit Existing Illnesses</ion-label>
        <ion-icon name="arrow-forward" class="arrow-icon"></ion-icon>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
